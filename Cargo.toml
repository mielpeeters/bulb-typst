[package]
name = "bulb-typst"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3

[dependencies]
bulb = { version = "1.0.0", default-features = false }
wasm-minimal-protocol = "0.2"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
] }
